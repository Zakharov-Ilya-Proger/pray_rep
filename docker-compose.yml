version: '3.8'

services:
  app:
    build:
      context: .
      network: host
    volumes:
      - ${MODEL}:/models/vosk-model-ru-0.42:ro
    container_name: worker-container
    environment:
      - WORKERS=${WORKERS}
      - QUEUE_KEY=${QUEUE_KEY}
      - REDIS=${REDIS}
      - MODEL_PATH=/models/vosk-model-ru-0.42
      - SAMPLE_RATE=${SAMPLE_RATE}
      - API_RECORD_PASS=${API_RECORD_PASS}
      - API_RECORD_URL=${API_RECORD_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - pray_rep_pray_rep_app_network

networks:
  pray_rep_pray_rep_app_network:
    external: true